<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rope Heist</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d29; font-family: system-ui, sans-serif; color: #fff; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 10px; font-size: 13px; line-height: 1.5; opacity: .9; pointer-events: none; text-shadow: 0 1px 2px #000; display: none; }
    #game { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; text-align: center; pointer-events: none; text-shadow: 0 1px 3px #000; }
    #timer { font-size: 30px; font-weight: 800; letter-spacing: 2px; }
    #timer.low { color: #ff6b6b; }
    #alertbar { width: 240px; height: 12px; margin: 6px auto 0; border-radius: 6px; background: #0007; overflow: hidden; border: 1px solid #fff4; }
    #alertfill { height: 100%; width: 0; background: linear-gradient(90deg, #ffd166, #ff4d4d); transition: width .15s linear; }
    #alertlabel { font-size: 11px; opacity: .8; letter-spacing: 2px; margin-top: 2px; }
    #objective { font-size: 12px; opacity: .85; margin-top: 4px; }
    #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; text-shadow: 0 2px 8px #000; z-index: 5; }
    #banner.show { display: flex; }
    #banner h2 { font-size: clamp(36px, 8vw, 84px); margin: 0; letter-spacing: 4px; }
    #banner p { font-size: 18px; margin: 8px 0 0; opacity: .9; }
    #banner.won h2 { color: #4ade80; }
    #banner.lost h2 { color: #ff6b6b; }
    #watchbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 94vw; padding: 8px 12px; border-radius: 12px; background: #0d0f18cc; font-size: 13px; z-index: 6; }
    #watchbar button { width: auto; margin: 0; padding: 6px 12px; font-size: 13px; background: #3a4170; }
    #watchbar button.on { background: #ff7a59; }
    #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #2b3050, #14161f); z-index: 10; }
    #menu.hidden { display: none; }
    .card { width: min(380px, 90vw); padding: 28px; border-radius: 16px; background: #232842; box-shadow: 0 10px 40px #0008; }
    h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 1px; }
    .sub { margin: 0 0 20px; opacity: .65; font-size: 14px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px; background: #ff7a59; color: #fff; cursor: pointer; width: 100%; margin-top: 10px; }
    button.alt { background: #3a4170; }
    button:disabled { opacity: .4; cursor: default; }
    input { font: inherit; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; text-align: center; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 2px solid #3a4170; background: #14161f; color: #fff; margin-top: 10px; }
    .row { display: flex; gap: 8px; }
    .row button { margin-top: 10px; }
    .code { font-size: 44px; font-weight: 800; letter-spacing: 10px; text-align: center; margin: 14px 0 4px; }
    .hint { font-size: 13px; opacity: .65; text-align: center; margin: 4px 0; }
    #error { color: #ff8a8a; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
    .panel { display: none; }
    .panel.show { display: block; }
    #players { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
    .prow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: #14161f; font-weight: 600; }
    .prow.empty { opacity: .4; font-weight: 400; }
    .dot { width: 18px; height: 18px; border-radius: 50%; background: #3a4170; flex: none; }
    input.namebox { font-size: 16px; letter-spacing: 0; text-transform: none; text-align: left; padding: 10px 12px; margin: 0 0 8px; }
    #swatches { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 14px; }
    button.sw { width: 30px; height: 30px; padding: 0; margin: 0; border-radius: 50%; border: 3px solid transparent; }
    button.sw.on { border-color: #fff; box-shadow: 0 0 0 2px #0008; }
  </style>
</head>
<body>
  <div id="hud"></div>

  <div id="game">
    <div id="timer">2:30</div>
    <div id="alertbar"><div id="alertfill"></div></div>
    <div id="alertlabel">ALERT</div>
    <div id="objective">Steal the gold safe (needs two of you) and bring it back to the green zone</div>
  </div>
  <div id="watchbar">
    <span id="watch-text"></span>
    <button data-speed="1">1x</button><button data-speed="2">2x</button><button data-speed="4">4x</button>
    <button id="watch-leave">Leave</button>
  </div>
  <div id="banner"><h2 id="banner-title"></h2><p id="banner-sub"></p></div>

  <div id="menu">
    <div class="card">
      <h1>ROPE HEIST</h1>
      <p class="sub">Rob the place. Don't untie yourselves.</p>

      <div id="p-main" class="panel show">
        <input id="in-name" class="namebox" maxlength="12" placeholder="Your name" autocomplete="off" />
        <div id="swatches"></div>
        <button id="b-host">Host a game</button>
        <input id="in-code" maxlength="4" placeholder="CODE" autocomplete="off" />
        <button id="b-join" class="alt">Join with code</button>
        <div class="row">
          <button id="b-watch" class="alt">Watch 2 bots play</button>
        </div>
        <div class="row">
          <button id="b-local" class="alt">Local 2P</button>
          <button id="b-chain" class="alt">Chain test (4)</button>
        </div>
        <div id="error"></div>
      </div>

      <div id="p-lobby" class="panel">
        <div id="lobby-title" class="hint">Share this code</div>
        <div id="lobby-code" class="code"></div>
        <div id="lobby-link" class="hint"></div>
        <div id="players"></div>
        <div id="lobby-status" class="hint"></div>
        <button id="b-start">Start heist</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
